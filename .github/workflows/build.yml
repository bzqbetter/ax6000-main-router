name: Build Redmi AX6000 firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af || true
          sudo apt-get -y purge 'azure-cli*' 'google-cloud*' 'microsoft-edge*' 'firefox*' 'google-chrome*' || true
          sudo apt-get -y autoremove --purge || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget curl ca-certificates libelf-dev zstd xz-utils bzip2 \
            patch diffutils time perl quilt

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build.sh
          JOBS=$(($(nproc) + 1)) ./build.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Collect images
        if: always()
        run: |
          mkdir -p out
          cp openwrt/bin/targets/mediatek/filogic/*redmi-router-ax6000-mtkuboot* out/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          cp openwrt/.config out/build.config 2>/dev/null || true
          (cd out && sha256sum * > sha256sums.txt) || true
          ls -lh out

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmi-ax6000-mtkuboot-${{ github.run_number }}
          path: out/
          retention-days: 30
